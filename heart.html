<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Love Heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060208;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      background-color: #060208;
      box-shadow: 0 0 30px rgba(180, 20, 50, 0.2);
    }
  </style>
</head>
<body>

<canvas id="heartCanvas" width="800" height="800"></canvas>

<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");

const SC = 21;
const OY = 20;
const DURATION = 10;
const TICK = 16;
const ANIM = 42;
const LIFT = 34;
const GAP = 7;
const SIZES = [9, 10, 11, 12];
const FONT = "Arial";
const BG = "#060208";

const PHRASES = [
  "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
  "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
  "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
  "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
  "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
];

function heart(a) {
  const x = 16 * Math.pow(Math.sin(a), 3);
  const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
  return [x * SC, y * SC + OY];
}

const POLY = [];
for (let i = 0; i < 720; i++) {
  POLY.push(heart((2 * Math.PI * i) / 720));
}

const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const CY = (YMAX + YMIN) / 2;

function spans(y) {
  const xs = [];
  for (const [[x1, y1], [x2, y2]] of EDGES) {
    if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
      xs.push(x1 + ((y - y1) * (x2 - x1)) / (y2 - y1));
    }
  }
  xs.sort((a, b) => a - b);
  const result = [];
  for (let i = 0; i < xs.length; i += 2) {
    result.push([xs[i], xs[i + 1]]);
  }
  return result;
}

function intersect(A, B) {
  const out = [];
  for (const a of A) {
    for (const b of B) {
      const lo = Math.max(a[0], b[0]);
      const hi = Math.min(a[1], b[1]);
      if (hi - lo > 14) out.push([lo, hi]);
    }
  }
  return out;
}

function* phraseCycle() {
  while (true) {
    const order = [...PHRASES];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    for (const phrase of order) yield phrase;
  }
}

function mathDist(x, y) {
  return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
}

function mix(a, b, k) {
  return a.map((p, i) => p + (b[i] - p) * k);
}

function dim(c, k) {
  return c.map(v => v * k);
}

function rgb(c) {
  const r = Math.floor(Math.max(0, Math.min(1, c[0])) * 255);
  const g = Math.floor(Math.max(0, Math.min(1, c[1])) * 255);
  const b = Math.floor(Math.max(0, Math.min(1, c[2])) * 255);
  return `rgb(${r},${g},${b})`;
}

const BGC = [0x06 / 255, 0x02 / 255, 0x08 / 255];
const FLASH = [1.0, 0.78, 0.78];

function build() {
  const cycle = phraseCycle();
  const rowH = 12 + 4;
  const half = rowH / 2;
  const placed = [];

  let y = YMAX - half;
  while (y > YMIN + half) {
    const row = intersect(spans(y + half), spans(y - half));
    for (let [lo, hi] of row) {
      lo += 4;
      hi -= 4;
      let cur = lo + Math.random() * 8;
      const line = [];

      while (true) {
        let fit = null;
        for (let _ = 0; _ < 10; _++) {
          const text = cycle.next().value;
          const size = SIZES[Math.floor(Math.random() * SIZES.length)];
          ctx.font = `bold ${size}px ${FONT}`;
          const w = ctx.measureText(text).width;
          if (cur + w <= hi) {
            fit = { text, size, w };
            break;
          }
        }
        if (!fit) break;
        line.push([cur + fit.w / 2, fit.text, fit.size, fit.w]);
        cur += fit.w + GAP;
      }

      if (!line.length) continue;

      if (line.length > 1) {
        const left = hi - (line[line.length - 1][0] + line[line.length - 1][3] / 2);
        line.forEach((it, i) => {
          it[0] += (left * i) / (line.length - 1);
        });
      } else {
        line[0][0] = (lo + hi) / 2;
      }

      line.forEach(([xPos, text, size], i) => {
        const edge = i === 0 || i === line.length - 1;
        placed.push({ x: xPos, y, text, size, edge });
      });
    }
    y -= rowH;
  }

  const wine = [0.58, 0.0, 0.09];
  const crimson = [0.90, 0.05, 0.14];
  const blood = [0.98, 0.10, 0.16];

  for (const p of placed) {
    const rad = Math.min(1.0, mathDist(p.x, p.y));
    let base = mix(wine, crimson, 0.25 + 0.75 * rad);
    base = mix(base, blood, Math.random() * 0.35 + (p.edge ? 0.3 : 0));
    p.color = base.map(v => Math.min(1, v));
    p.rad = rad;
  }

  const edges = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);
  edges.sort((a, b) => ((Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) - (Math.atan2(b.x, b.y - CY) % (2 * Math.PI))));
  inner.sort((a, b) => -a.rad + Math.random() * 0.08 - (-b.rad + Math.random() * 0.08));

  return [...edges, ...inner];
}

const ORDER = build();
let itemIdx = 0;
const RATE = ORDER.length / ((DURATION * 1000) / TICK);
let acc = 0.0;
let spawning = true;
const active = [];
const renderedItems = [];

function clamp(v) { return Math.max(0.0, Math.min(1.0, v)); }

function spawn(p) {
  p.f = 0;
  p.dx = (Math.random() - 0.5) * 20;
  p.currentColor = BGC;
  active.push(p);
  renderedItems.push(p);
}

function animate(p) {
  p.f += 1;
  const u = clamp(p.f / ANIM);
  const e = 1 - Math.pow(1 - u, 3);
  const hover = (1 - e) * LIFT;
  p.renderX = p.x + p.dx * (1 - e);
  p.renderY = p.y + hover; // invertido para descer/subir corretamente no Canvas

  const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
  p.currentColor = mix(mix(BGC, p.color, Math.pow(e, 1.5)), FLASH, flash);

  if (u >= 1) {
    p.renderX = p.x;
    p.renderY = p.y;
    p.currentColor = p.color;
    return false;
  }
  return true;
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  // Centraliza a origem no meio do canvas
  ctx.translate(canvas.width / 2, canvas.height / 2);

  for (const p of renderedItems) {
    ctx.font = `bold ${p.size}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const rx = p.renderX !== undefined ? p.renderX : p.x;
    const ry = p.renderY !== undefined ? p.renderY : p.y;

    // Invertemos a coordenada Y do Canvas no desenho (-ry) para manter a orientação do coração
    const drawY = -ry;

    // Sombra
    ctx.fillStyle = rgb(mix(BGC, dim(p.color, 0.30), 1));
    ctx.fillText(p.text, rx + 2, drawY + 3);

    // Texto Principal
    ctx.fillStyle = rgb(p.currentColor || p.color);
    ctx.fillText(p.text, rx, drawY);
  }

  ctx.restore();
}

function step() {
  if (spawning) {
    acc += RATE;
    while (acc >= 1) {
      acc -= 1;
      if (itemIdx < ORDER.length) {
        spawn(ORDER[itemIdx++]);
      } else {
        spawning = false;
        break;
      }
    }
  }

  for (let i = active.length - 1; i >= 0; i--) {
    if (!animate(active[i])) {
      active.splice(i, 1);
    }
  }

  draw();

  if (!spawning && active.length === 0) {
    shimmer();
    return;
  }

  setTimeout(step, TICK);
}

function shimmer() {
  if (renderedItems.length > 0) {
    const target = renderedItems[Math.floor(Math.random() * renderedItems.length)];
    const origColor = target.color;
    target.currentColor = mix(origColor, FLASH, 0.6);
    draw();

    setTimeout(() => {
      target.currentColor = origColor;
      draw();
    }, 260);
  }
  setTimeout(shimmer, 140);
}

setTimeout(step, 200);
</script>

</body>
</html>
